<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألبوم الملصقات · تدريب النطق</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="stylesheet" href="../assets/accounts.css"><link rel="stylesheet" href="../assets/clinic.css">
<!-- The sticker album: one sticker for each finished day's session (assets/therapy.js gives it), drawn as a picture of a
     word with the session's sound from the words game's own art. Open to the child and to parents. -->
<style>
:root{--ink:#22445a;--muted:#5c7285;--line:#e3ecf2;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top right,#fff3cf,transparent 55%),radial-gradient(ellipse at bottom left,#e0f2fe,transparent 50%),#f8fafc;color:var(--ink);font-family:Cairo,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header a{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 4px 14px #22445a14}
header svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header h1{flex:1;margin:0;font-size:24px;line-height:1.35}
.who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
main{width:min(100%,880px);margin:0 auto;padding:4px 16px 32px}
.count{margin:0 0 14px;color:var(--muted);font-size:17px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px;padding:20px;border-radius:28px;background:#fffdf6;box-shadow:inset 0 0 0 2px #f3e3b8,0 10px 30px #c58a1214}
.sticker{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0}
.sticker .pic{display:grid;place-items:center;width:118px;height:118px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:0 0 0 2px #f0b63b,0 8px 18px #22445a26;overflow:hidden;transform:rotate(var(--tilt,0deg))}
.sticker img{width:100%;height:100%;object-fit:contain}
.sticker .letter{font-size:52px;font-weight:800;color:#8a5a00}
.sticker figcaption{font-size:13px;color:var(--muted);text-align:center;line-height:1.4}
.sticker figcaption b{display:block;font-size:16px;color:var(--ink)}
.slot .pic{background:transparent;border:3px dashed #e6d3a0;box-shadow:none}
.empty{grid-column:1/-1;margin:8px 0;text-align:center;font-size:18px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sticker:not(.slot){animation:stick .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}}
@keyframes stick{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
</style>
<script src="../words/assets/data.js" defer></script>
<script src="../words/assets/art-kit.js" defer></script>
<script src="../words/assets/art-common.js" defer></script>
<script src="../words/assets/art-words-alef.js" defer></script>

<script src="../words/assets/art-words-ra.js" defer></script>

<body>
<header>
 <a href="../index.html" aria-label="الصفحة الرئيسية" title="الصفحة الرئيسية"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H5V10M9 21v-8h6v8"/></svg></a>
 <h1>ألبوم الملصقات</h1>
 <span id="who" class="who"></span>
</header>
<main>
 <p id="count" class="count" role="status"></p>
 <section id="book" class="book" aria-label="الملصقات"></section>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const Children = window.ArticulationChildren, T = window.ArticulationTherapy, Data = window.ArticulationData, Art = window.ArticulationArt;
  const digits = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const child = Children.active(), list = [...(child?.stickers || [])].reverse();
  const who = document.getElementById('who');
  if (child) { if (window.SuiteAccounts?.avatarFor) who.append(window.SuiteAccounts.avatarFor(child, 'small')); who.append(child.name); }
  // The same word every time for a sticker: chosen from its session id among the words with its sound.
  const hash = text => [...String(text)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  function wordFor(item) {
    const sound = item.letter && Data?.soundById(T?.WORD_IDS[item.letter]); if (!sound) return null;
    const words = Object.values(sound.words).flat(); return words[hash(item.session) % words.length] || null;
  }
  const date = iso => { try { return new Intl.DateTimeFormat('ar-SY', { day: 'numeric', month: 'long' }).format(new Date(iso + 'T12:00:00')); } catch { return iso; } };
  const book = document.getElementById('book');
  document.getElementById('count').textContent = !child ? 'اختر حساب الطفل من الصفحة الرئيسية.' : list.length ? `${digits(list.length)} ${list.length === 1 ? 'ملصق' : list.length === 2 ? 'ملصقان' : 'ملصقات'}` : '';
  const cards = list.map((item, i) => {
    const word = wordFor(item), fig = document.createElement('figure'); fig.className = 'sticker'; fig.style.setProperty('--i', i); fig.style.setProperty('--tilt', `${(hash(item.session) % 13) - 6}deg`);
    const pic = document.createElement('span'); pic.className = 'pic';
    if (word && Art) { const img = new Image(); img.src = Art.objectURI(word.art); img.alt = word.word; pic.append(img); }
    else { const letter = document.createElement('span'); letter.className = 'letter'; letter.textContent = item.letter || '★'; pic.append(letter); }
    const cap = document.createElement('figcaption'); cap.innerHTML = `<b></b>${date(item.date)}`; cap.querySelector('b').textContent = word?.word || (item.letter ? `صوت ${item.letter}` : 'تدريب اليوم');
    fig.append(pic, cap); return fig;
  });
  // Empty places up to a full row invite the next sticker.
  const slots = Array.from({ length: Math.max(3, 6 - cards.length % 6) }, () => { const fig = document.createElement('figure'); fig.className = 'sticker slot'; fig.setAttribute('aria-hidden', 'true'); fig.innerHTML = '<span class="pic"></span>'; return fig; });
  book.replaceChildren(...cards, ...slots);
  if (child && !cards.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'أكمل تدريب اليوم لتحصل على أول ملصق.'; book.prepend(p); }
});
</script>
</body>
</html>
